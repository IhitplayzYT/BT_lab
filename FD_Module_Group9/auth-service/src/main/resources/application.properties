spring.application.name=auth-service
server.port=8090
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.security.enabled=false
# The signing secret comes ONLY from the JWT_SECRET environment variable (at least 32 characters). There is no default.
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:fd-platform-auth}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:60}
app.login.max-failures=5
app.login.lock-seconds=60
