# Lab 16 test profile: in-memory H2 (MySQL mode) instead of the local MySQL server.
# ddl-auto=create-drop builds the schema from the entities for tests only; the real
# database still uses ddl-auto=validate with sql/l16_fd_transactions.sql.
spring.datasource.url=jdbc:h2:mem:fdtest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

events.enabled=false

# Test-only signing key (never used outside tests) so Bearer-token tests can run.
app.jwt.secret=test-only-secret-test-only-secret-0001
app.jwt.issuer=fd-platform-auth

app.security.basic.enabled=false
