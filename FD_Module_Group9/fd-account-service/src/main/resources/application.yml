spring:
  application:
    name: fd-account-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${FD_DB_URL:jdbc:mysql://localhost:3306/banking_technology_lab?serverTimezone=Asia/Kolkata}
    username: ${DB_USER:fd}
    password: ${DB_PASSWORD:fd-demo-only}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  security:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        max.block.ms: 10000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
      concurrency: 1

server:
  port: 8086

events:
  enabled: ${EVENTS_ENABLED:true}
  topic-partitions: ${KAFKA_TOPIC_PARTITIONS:3}
  topic-replicas: ${KAFKA_TOPIC_REPLICAS:1}

# JWT: the signing key comes only from the JWT_SECRET environment variable. Empty = Bearer tokens are not accepted (Basic only).
app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:fd-platform-auth}
  security:
    basic:
      enabled: ${APP_SECURITY_BASIC_ENABLED:false}

# Internal service base URLs for integration
services:
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://product-service:8080}
    connect-timeout-ms: ${PRODUCT_CONNECT_TIMEOUT:3000}
    read-timeout-ms: ${PRODUCT_READ_TIMEOUT:5000}
  calculator:
    base-url: ${CALCULATOR_SERVICE_URL:http://fd-calculator:8084}
    connect-timeout-ms: ${CALCULATOR_CONNECT_TIMEOUT:3000}
    read-timeout-ms: ${CALCULATOR_READ_TIMEOUT:5000}
  auth:
    base-url: ${AUTH_SERVICE_URL:http://fd-auth-service:8090}
