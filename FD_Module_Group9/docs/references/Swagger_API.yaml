          description: Early withdrawal completed successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FD_FDAccountView'
        '400':
          description: Invalid withdrawal request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FD_FDAccountView'
        '404':
          description: Account not found
          content:
            '*/*':
