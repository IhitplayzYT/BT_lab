        username:
          type: string
          example: johndoe
        email:
          type: string
          format: email
          example: johndoe@example.com
        role:
          type: string
          example: CUSTOMER
          enum:
          - CUSTOMER
          - BANK_OFFICER
          - ADMIN
          default: CUSTOMER
        createdAt:
          type: string
          format: date-time
          example: 2023-01-01 12:00:00+00:00
    Auth_RegisterRequest:
      required:
      - email
      - password
      - username
      type: object
      properties:
        username:
          type: string
          example: johndoe
        password:
          type: string
          writeOnly: true
          example: strongpassword123
        email:
          type: string
          format: email
          example: johndoe@example.com
    Auth_LoginRequest:
      required:
      - password
      - username
      type: object
      properties:
        username:
          type: string
          example: johndoe
        password:
          type: string
          writeOnly: true
          example: strongpassword123
    Auth_LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
