                $ref: '#/components/schemas/Product_ErrorResponse'
    put:
      tags:
      - Product Management
      summary: Maintain/update a product
      description: 'Update mutable fields of an existing product, such as product name or

        interest (rate) range.

        '
      operationId: updateProduct
      parameters:
      - name: productCode
        in: path
        required: true
        schema:
          type: string
        example: FD001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product_UpdateProductRequest'
            examples:
              Update Name and Rate:
                value:
                  productName: Fixed Deposit - Short Term (Revised)
                  rateLimit:
                    min: 5.5
                    max: 8.0
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product_ProductView'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product_ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product_ErrorResponse'
    delete:
      tags:
      - Product Management
      summary: Deactivate a product
      description: Retires/deactivates a product so it can no longer be used for new accounts.
      operationId: deactivateProduct
      parameters:
      - name: productCode
        in: path
        required: true
        schema:
          type: string
        example: FD001
      responses:
        '204':
          description: Product deactivated successfully
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product_ErrorResponse'
