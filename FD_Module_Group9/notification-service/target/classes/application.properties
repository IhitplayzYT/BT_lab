spring.application.name=notification-service
server.port=8083
spring.datasource.url=${SERVICE_DB_URL:jdbc:mysql://localhost:3306/fd_notifications?serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USER:fd}
spring.datasource.password=${DB_PASSWORD:fd-demo-only}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
events.enabled=${EVENTS_ENABLED:true}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.max.block.ms=10000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=1
events.topic-partitions=${KAFKA_TOPIC_PARTITIONS:3}
events.topic-replicas=${KAFKA_TOPIC_REPLICAS:1}
# Real e-mail is OFF unless SPRING_MAIL_HOST (+ PORT/USERNAME/PASSWORD) environment variables are set.
# Without them the service logs "[MOCK EMAIL]" and stores status MOCKED in notifications_log.
notify.email.from=${NOTIFY_EMAIL_FROM:noreply@fd-bank.local}
# true = never send real mail (log [MOCK EMAIL] and store MOCKED) even if SPRING_MAIL_HOST is set. Handy for test runs.
notify.email.mock-only=${NOTIFY_EMAIL_MOCK_ONLY:false}
# Spring Mail configuration - required for JavaMailSender bean to be created
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

# JWT: the signing key comes only from the JWT_SECRET environment variable. Empty = Bearer tokens are not accepted (Basic only).
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:fd-platform-auth}
# HTTP Basic demo logins (admin1/officer1/customer1). Set APP_SECURITY_BASIC_ENABLED=false to accept only JWT tokens.
app.security.basic.enabled=${APP_SECURITY_BASIC_ENABLED:true}

# WhatsApp through the free Twilio sandbox. Mock unless TWILIO_SID and TWILIO_TOKEN are both set.
notify.whatsapp.twilio.sid=${TWILIO_SID:}
notify.whatsapp.twilio.token=${TWILIO_TOKEN:}
notify.whatsapp.twilio.from=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
notify.whatsapp.mock-only=${NOTIFY_WHATSAPP_MOCK_ONLY:false}

notify.whatsapp.twilio.content-sid=${TWILIO_WHATSAPP_CONTENT_SID:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
