<div class="advanced-charts">
  <h2 class="text-gradient">Advanced Analytics Visualizations</h2>
  
  <div class="charts-grid">
    <!-- Line Chart - Monthly Deposits Trend -->
    <div class="chart-card card">
      <h3>Monthly Deposits Trend</h3>
      <div class="chart-container">
        <canvas id="lineChart"></canvas>
      </div>
    </div>

    <!-- Area Chart - Interest Trend -->
    <div class="chart-card card">
      <h3>Interest Earned Trend</h3>
      <div class="chart-container">
        <canvas id="areaChart"></canvas>
      </div>
    </div>

    <!-- Donut Chart - Product Distribution -->
    <div class="chart-card card">
      <h3>Product Distribution</h3>
      <div class="chart-container">
        <canvas id="donutChart"></canvas>
      </div>
    </div>

    <!-- Scatter Plot - Tenure vs Interest Rate -->
    <div class="chart-card card">
      <h3>Tenure vs Interest Rate</h3>
      <div class="chart-container">
        <canvas id="scatterChart"></canvas>
      </div>
    </div>

    <!-- Stacked Bar Chart - Quarterly Product Mix -->
    <div class="chart-card card">
      <h3>Quarterly Product Mix</h3>
      <div class="chart-container">
        <canvas id="stackedBarChart"></canvas>
      </div>
    </div>

    <!-- Box Plot - Amount Distribution -->
    <div class="chart-card card">
      <h3>Deposit Amount Distribution</h3>
      <div class="chart-container">
        <canvas id="boxPlotChart"></canvas>
      </div>
    </div>

    <!-- Heatmap - Maturity Calendar -->
    <div class="chart-card card full-width">
      <h3>Maturity Calendar Heatmap</h3>
      <div class="chart-container">
        <canvas id="heatmapChart"></canvas>
      </div>
    </div>

    <!-- Violin Plot - Customer Segmentation Distribution -->
    <div class="chart-card card full-width">
      <h3>Customer Deposit Distribution</h3>
      <div class="chart-container">
        <canvas id="violinChart"></canvas>
      </div>
    </div>
  </div>
</div>
