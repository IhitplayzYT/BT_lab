spring.application.name=auth-service
services.account.base-url=${ACCOUNT_SERVICE_URL:http://localhost:8086}
server.port=8090
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.security.enabled=false

# Database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:auth_user}
spring.datasource.password=${DB_PASSWORD:auth_secret}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# The signing secret comes ONLY from the JWT_SECRET environment variable (at least 32 characters). There is no default.
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:fd-platform-auth}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:60}
app.jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:7}
app.login.max-failures=5
app.login.lock-seconds=60

# Email configuration for OTP
spring.mail.host=${SMTP_RELAY_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_RELAY_PORT:587}
spring.mail.username=${SMTP_RELAY_USERNAME:}
spring.mail.password=${SMTP_RELAY_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_RELAY_AUTH:plain}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_RELAY_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=${NOTIFY_EMAIL_FROM:noreply@fd-bank.local}
