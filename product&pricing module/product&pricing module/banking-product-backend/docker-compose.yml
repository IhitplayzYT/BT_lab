version: "3.9"

services:

  # ── Product & Pricing Service ──────────────────────────────────────────────
  product-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://product-mysql:3306/banking_product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: product_user
      DB_PASSWORD: ${DB_PASSWORD:-product_secret}
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      JWT_SECRET: ${JWT_SECRET:-test-secret-key-minimum-32-characters-for-hmac256}
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8081}
      JWT_AUDIENCE: product-service
      JWT_ROLES_CLAIM: roles
    depends_on:
      product-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - shared-network

  # ── MySQL ──────────────────────────────────────────────────────────────
  product-mysql:
    image: mysql:8.0
    container_name: product-mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: banking_product_db
      MYSQL_USER: product_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-product_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    volumes:
      - product_mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./insert_dummy_data.sql:/docker-entrypoint-initdb.d/02-insert_dummy_data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "product_user", "--password=${DB_PASSWORD:-product_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - shared-network

volumes:
  product_mysql_data:

networks:
  shared-network:
    external: true
