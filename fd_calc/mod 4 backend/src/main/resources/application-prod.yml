# ══════════════════════════════════════════════════════════════════════════════
# Profile: prod  – all values MUST be provided as environment variables
# ══════════════════════════════════════════════════════════════════════════════

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

  h2:
    console:
      enabled: false

# ── Mock clients MUST be disabled in production ────────────────────────────
mock:
  product-client: false
  customer-client: false

# ── JWT production configuration ──────────────────────────────────────────
# Option A (current): symmetric HMAC-256 secret supplied via env var.
# Option B (future):  uncomment issuer-uri below and remove app.jwt.secret.
#   spring.security.oauth2.resourceserver.jwt.issuer-uri: ${JWT_ISSUER_URI}
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE:fd-calculator-service}
    roles-claim: ${JWT_ROLES_CLAIM:roles}

services:
  product:
    base-url: ${PRODUCT_SERVICE_URL}
    connect-timeout-ms: ${PRODUCT_CONNECT_TIMEOUT:3000}
    read-timeout-ms: ${PRODUCT_READ_TIMEOUT:5000}
  customer:
    base-url: ${CUSTOMER_SERVICE_URL}
    connect-timeout-ms: ${CUSTOMER_CONNECT_TIMEOUT:3000}
    read-timeout-ms: ${CUSTOMER_READ_TIMEOUT:5000}

logging:
  level:
    com.bank.calculator: DEBUG
    org.springframework.security: WARN
    com.bank.calculator.client: DEBUG
    feign: DEBUG
    com.bank.calculator.service: DEBUG
    com.bank.calculator.config: DEBUG
    com.bank.calculator.service.impl: DEBUG
