<app-navbar></app-navbar>
<section class="help-center-section section">
  <div class="container">
    <div class="section-header">
      <h1 class="text-gradient">Help Center</h1>
      <p>Find answers to frequently asked questions about our services</p>
    </div>

    <div class="help-content">
      @for (faq of faqs; track faq.question) {
        <div class="faq-item card">
          <h3>{{ faq.question }}</h3>
          <p>{{ faq.answer }}</p>
        </div>
      }
    </div>

    <div class="contact-cta card">
      <h3>Still need help?</h3>
      <p>Can't find what you're looking for? Our support team is here to assist you.</p>
      <button class="btn btn-primary" (click)="navigateTo('/contact')">Contact Support</button>
    </div>
  </div>
</section>
<app-footer></app-footer>
