<section class="security section">
  <div class="container">
    <div class="section-header">
      <h2 class="text-gradient">Bank-Grade Security</h2>
      <p>Your money is protected with industry-leading security measures</p>
    </div>

    <div class="security-grid">
      @for (feature of features; track feature.title) {
        <div class="security-card card">
          <div class="security-icon">{{ feature.icon }}</div>
          <h3>{{ feature.title }}</h3>
          <p>{{ feature.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
