spring:
  application:
    name: product-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/banking_product_db}
    username: ${DB_USER:product_user}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: never
server:
  port: ${SERVER_PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:fd-platform-auth}
  security:
    basic:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
springdoc:
  api-docs:
    path: /v3/api-docs
